# =============================================================================
# DMS-O2 — Host-Level Nginx Reverse Proxy Configuration (Option B)
# =============================================================================
# Purpose:
#   Runs on the Host Server (outside Docker) on ports 80/443.
#   Accepts traffic from clients on your LAN or the Internet and passes
#   the REAL client IP address (via X-Real-IP and X-Forwarded-For) into
#   the DMS-O2 Docker container listening on 127.0.0.1:8080.
#
# Installation on Host (Ubuntu/Debian):
#   1. Copy this file to /etc/nginx/sites-available/dms.conf
#   2. Link: sudo ln -s /etc/nginx/sites-available/dms.conf /etc/nginx/sites-enabled/
#   3. Test & reload: sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    server_name _; # Responds to any domain or server IP address

    # File upload size limits (for CAD dxf files and excel bulk imports)
    client_max_body_size 50M;

    # Performance buffers
    proxy_buffers 16 32k;
    proxy_buffer_size 64k;

    location / {
        # Forward to DMS-O2 Docker Container on local port 8080
        proxy_pass http://127.0.0.1:8080;

        # ---------------------------------------------------------------------
        # CRITICAL: Pass the Real Client IP Headers
        # ---------------------------------------------------------------------
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # ---------------------------------------------------------------------
        # WebSocket & Server-Sent Events (SSE) Support
        # ---------------------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
