# Password recovery: docker compose exec django python manage.py changepassword root
x-common-env: &common-env
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_DEBUG: ${DJANGO_DEBUG}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
  MEILI_HOST: ${MEILI_HOST}
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
  ROOT_USERNAME: ${ROOT_USERNAME}
  ROOT_PASSWORD: ${ROOT_PASSWORD}
  SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES}
  SESSION_ABSOLUTE_TIMEOUT_HOURS: ${SESSION_ABSOLUTE_TIMEOUT_HOURS}
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    command: >
      postgres
      -c lock_timeout=30000
      -c idle_in_transaction_session_timeout=300000
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'

  migrate:
    image: dms-o2-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py migrate --noinput
    volumes:
      - ./backend:/app
      - ./backups:/backups
      - django_tmp:/app/tmp
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: "no"

  django:
    image: dms-o2-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    command: gunicorn dms.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --worker-class gthread --reload
    volumes:
      - ./backend:/app
      - ./backups:/backups
      - django_tmp:/app/tmp
    environment:
      <<: *common-env
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 2m
    healthcheck:

      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django.rule=PathPrefix(`/api`) || PathPrefix(`/admin`)"
      - "traefik.http.routers.django.entrypoints=websecure"
      - "traefik.http.routers.django.tls=true"
      - "traefik.http.routers.django.priority=50"
      - "traefik.http.services.django.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.burst=150"
      - "traefik.http.routers.django.middlewares=api-ratelimit,api-compress"
      - "traefik.http.middlewares.api-compress.compress=true"
      # Dedicated login & MFA route rate limiting
      - "traefik.http.routers.django-login.rule=Path(`/api/v1/auth/login/`) || Path(`/api/auth/login/`) || Path(`/api/v1/auth/mfa/verify/`) || Path(`/api/auth/mfa/verify/`)"
      - "traefik.http.routers.django-login.entrypoints=websecure"
      - "traefik.http.routers.django-login.tls=true"
      - "traefik.http.routers.django-login.priority=60"
      - "traefik.http.routers.django-login.middlewares=login-ratelimit,api-compress"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.burst=10"

  worker:
    image: dms-o2-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    command: celery -A dms worker -l warning --concurrency=4 -Q default
    volumes:
      - ./backend:/app
      - ./backups:/backups
      - django_tmp:/app/tmp
    environment:
      <<: *common-env
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "celery -A dms inspect ping"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  heavy-worker:
    image: dms-o2-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    command: celery -A dms worker -l warning --concurrency=2 -Q heavy
    volumes:
      - ./backend:/app
      - ./backups:/backups
      - django_tmp:/app/tmp
    environment:
      <<: *common-env
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    stop_grace_period: 5m
    healthcheck:
      test: ["CMD-SHELL", "celery -A dms inspect ping"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

  beat:
    image: dms-o2-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    command: celery -A dms beat -l warning --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    environment:
      <<: *common-env
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid) 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'


  go-api:
    image: dms-o2-go-api:latest
    build:
      context: ./go-api
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-disable}
      - MEILI_HOST=${MEILI_HOST}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_SEARCH_KEY=${MEILI_SEARCH_KEY}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PORT=8080
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/go/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.go-api.rule=PathPrefix(`/api/go`)"
      - "traefik.http.routers.go-api.entrypoints=websecure"
      - "traefik.http.routers.go-api.tls=true"
      - "traefik.http.routers.go-api.priority=100"
      - "traefik.http.routers.go-api.middlewares=go-compress"
      - "traefik.http.services.go-api.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.go-compress.compress=true"
      # Dedicated unbuffered SSE streaming router
      - "traefik.http.routers.go-events.rule=PathPrefix(`/api/events`)"
      - "traefik.http.routers.go-events.entrypoints=websecure"
      - "traefik.http.routers.go-events.tls=true"
      - "traefik.http.routers.go-events.priority=110"
      - "traefik.http.routers.go-events.service=go-api"

  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=${MEILI_ENV:-production}
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 3s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping 2>/dev/null | grep -q PONG || redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 10

  frontend:
    image: dms-o2-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      django:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.middlewares.frontend-compress.compress=true"
      - "traefik.http.routers.frontend.middlewares=frontend-compress"

  traefik:
    image: traefik:v3
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      django:
        condition: service_healthy
      frontend:
        condition: service_started

  edge-gateway:
    image: dms-o2-edge-gateway:latest
    build:
      context: ./services/edge-gateway
      dockerfile: Dockerfile
    profiles: ["telemetry", "full"]
    restart: unless-stopped
    environment:
      - PLC_MODE=TCP
      - PLC_HOST=plc-simulator
      - PLC_PORT=1502
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CHANNEL=dms:events:broadcast
      - MACHINE_ID=EN-01
      - POLL_INTERVAL_MS=500
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'

  metallurgy-analytics:
    image: dms-metallurgy-analytics:latest
    build:
      context: ./services/metallurgy-analytics
      dockerfile: Dockerfile
    profiles: ["analytics", "full"]
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

volumes:
  postgres_data:
  meili_data:
  redis_data:
  django_tmp:
